# Builds the Windows release from a version tag:
#   Nuitka folder build -> self-test -> sign the program (SignPath)
#   -> Inno Setup installer -> sign the installer (SignPath) -> draft GitHub release.
#
# Signing runs only when the repository variable SIGNPATH_ORGANIZATION_ID and the secret
# SIGNPATH_API_TOKEN are set (Settings > Secrets and variables > Actions). Until then the
# workflow still builds, tests and drafts an unsigned release.
#
# Optional repository variables (defaults in brackets):
#   SIGNPATH_PROJECT_SLUG [FoolsGold_Pywriter]   SIGNPATH_POLICY_SLUG [release-signing]
#
# To release:  bump APP_VERSION in pywriter/__init__.py, commit, then
#   git tag v1.2.3 && git push origin v1.2.3
# The draft release appears under Releases; check it, then publish it by hand.

name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the draft release
  actions: read     # SignPath reads the uploaded build artifacts

env:
  SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest   # GitHub-hosted, as SignPath requires for open-source signing
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from pywriter import APP_VERSION; print(APP_VERSION)"
          $v4 = python build.py --print-version4
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match APP_VERSION $v in pywriter/__init__.py"; exit 1
          }
          "version=$v"  >> $env:GITHUB_OUTPUT
          "version4=$v4" >> $env:GITHUB_OUTPUT

      - name: Cache Nuitka's compiled modules
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}-${{ github.sha }}
          restore-keys: nuitka-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}-

      - name: Build with Nuitka and run the self-test
        run: python build.py

      - name: Keep the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: dist/selftest.json
          if-no-files-found: ignore

      # ---------------------------------------------------------------- sign the program
      - name: Upload the unsigned program
        id: upload-app
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/FoolsGoldPyWriter/

      - name: Sign the program (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'FoolsGold_Pywriter' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app-folder
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # every release is approved by hand
          output-artifact-directory: dist/app-signed
          parameters: |
            version: "${{ steps.ver.outputs.version4 }}"

      - name: Use the signed program
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist/FoolsGoldPyWriter
          Move-Item dist/app-signed dist/FoolsGoldPyWriter
          (Get-AuthenticodeSignature dist/FoolsGoldPyWriter/FoolsGoldPyWriter.exe).Status

      # ---------------------------------------------------------------- installer
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        run: python build.py --installer-only

      - name: Upload the unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/FoolsGoldPyWriter-${{ steps.ver.outputs.version }}-setup.exe

      - name: Sign the installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'FoolsGold_Pywriter' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/installer-signed
          parameters: |
            version: "${{ steps.ver.outputs.version4 }}"

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = if ($env:SIGNING -eq 'true') { "dist/installer-signed" } else { "dist" }
          Copy-Item "$setup/FoolsGoldPyWriter-${{ steps.ver.outputs.version }}-setup.exe" release/
          Copy-Item TERMS-OF-USE.md, test-instructions.txt release/
          Get-FileHash release/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/

      - name: Draft the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ github.ref_name }} already exists; the built files are in the 'release-files' artifact."
            exit 0
          }
          $signed = if ($env:SIGNING -eq 'true') { "Signed via SignPath." } else { "Unsigned build: Windows SmartScreen may warn (More info > Run anyway)." }
          gh release create "${{ github.ref_name }}" release/* --draft --title "FoolsGold PyWriter ${{ steps.ver.outputs.version }}" --notes "Windows installer: FoolsGoldPyWriter-${{ steps.ver.outputs.version }}-setup.exe. $signed See README for running from source on macOS and Linux, and test-instructions.txt for testing."
